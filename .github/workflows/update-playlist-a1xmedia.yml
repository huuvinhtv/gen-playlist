name: Sync M3U A1xmedia Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để push nhánh mới

    steps:
      # 1. Checkout repo (không fix cứng nhánh nữa)
      - name: Checkout gen-playlist repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng: Kéo toàn bộ lịch sử nhánh về để rẽ nhánh không bị lỗi

      # 2. Checkout repo private chứa script
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: huuvinhtv/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      # 3. Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # 4. Cài đặt thư viện
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      # 5. Chạy script (Nó sẽ tạo ra file playlist.m3u)
      - name: Run playlist engine
        run: |
          python engine/download_playlist_a1xmedia.py

      # 6. Xử lý Git: Tự tạo nhánh và Push (ĐÃ FIX LỖI GIT)
      - name: Commit and push generated playlist A1xmedia
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Di chuyển file mới tạo ra thư mục cha tạm thời để không bị xung đột khi checkout
          mv a1xmedia.m3u ../a1xmedia.m3u
          
          # Xóa thư mục mã nguồn private
          rm -rf engine
          
          # Fetch thông tin nhánh m3u từ server về
          git fetch origin m3u || true
          
          # Checkout sang nhánh m3u. Nếu chưa tồn tại thì tạo mới.
          git checkout m3u || git checkout -b m3u
          
          # Đồng bộ lịch sử commit từ remote (phòng lỗi non-fast-forward)
          git pull origin m3u --rebase || true
          
          # Đưa file m3u vừa sinh ra quay trở lại workspace (chép đè lên file cũ của nhánh)
          mv ../a1xmedia.m3u ./a1xmedia.m3u
          
          # Cập nhật file vào Git
          git add a1xmedia.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update playlist"
            # Push code lên nhánh m3u
            git push -u origin m3u
          fi
